<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>الملف الشخصي</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .profile-header { text-align: center; border-bottom: 2px solid var(--border); padding-bottom: 20px; margin-bottom: 20px; }
        .grid-info { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .info-box { background: rgba(0,0,0,0.02); padding: 15px; border-radius: 8px; border: 1px solid var(--border); }
        .info-box span { display: block; font-size: 12px; color: gray; margin-bottom: 5px; }
        .info-box strong { font-size: 16px; }
    </style>
</head>
<body>
    <div class="container" style="max-width: 800px;">
        <div class="no-print" style="margin-bottom: 20px; display: flex; justify-content: space-between;">
            <button class="btn btn-dark" onclick="window.history.back()">رجوع</button>
            <button class="btn btn-primary" onclick="window.print()" data-i18n="print">طباعة</button>
        </div>

        <div class="card" id="profileCard">
            <!-- Data injected via JS -->
        </div>
    </div>
    <script src="app.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const personId = parseInt(urlParams.get('id'));
        const p = APP.getDB().find(item => item.id === personId);

        if (p) {
            document.getElementById('profileCard').innerHTML = `
                <div class="profile-header">
                    <img src="image_5321de.png" width="80" style="margin-bottom:10px;">
                    <h1 style="margin:0; color:var(--gn-green);">${p.nom} ${p.family}</h1>
                    <p style="margin:5px 0; font-weight:bold; color:var(--gn-red);">${p.statut}</p>
                </div>
                <div class="grid-info">
                    <div class="info-box"><span>Famille / العائلة</span><strong>${p.family}</strong></div>
                    <div class="info-box"><span>Date et Lieu de Naissance / التولد</span><strong>${p.dob} - ${p.pob}</strong></div>
                    <div class="info-box"><span>Père / الأب</span><strong>${p.pere}</strong></div>
                    <div class="info-box"><span>Mère / الأم</span><strong>${p.mere}</strong></div>
                    <div class="info-box"><span>Profession / المهنة</span><strong>${p.prof}</strong></div>
                    <div class="info-box"><span>N° Passeport / رقم الجواز</span><strong>${p.pass}</strong></div>
                    <div class="info-box"><span>Expiration / الانتهاء</span><strong>${p.exp}</strong></div>
                    <div class="info-box"><span>Observations / ملاحظات</span><strong>${p.obs}</strong></div>
                </div>
            `;
        } else {
            document.getElementById('profileCard').innerHTML = "<h3 style='text-align:center;'>المواطن غير موجود</h3>";
        }
    </script>
</body>
</html>
