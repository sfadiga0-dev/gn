<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الملف الشخصي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="max-width: 800px;">
        <div class="no-print" style="margin-bottom: 20px;">
            <button class="btn btn-dark" onclick="window.history.back()">رجوع</button>
        </div>
        <div class="card-glass" id="profileContent">
            <!-- يملأ عبر الجافاسكربت -->
        </div>
    </div>
    <script src="app.js"></script>
    <script>
        const personId = parseInt(new URLSearchParams(window.location.search).get('id'));
        const p = APP.getDB().find(x => x.id === personId);
        
        if(p) {
            document.getElementById('profileContent').innerHTML = `
                <div style="text-align: center; border-bottom: 2px solid var(--gn-yellow); padding-bottom: 20px; margin-bottom: 20px;">
                    <img src="image_5321de.png" width="80" style="margin-bottom: 10px;">
                    <h1 style="margin:0; color:var(--gn-green);">${p.nomAr}</h1>
                    <h2 class="fr-text" style="margin:5px 0 0 0; color:#555; text-align:center;">${p.nomFr}</h2>
                </div>
                <div class="form-grid">
                    <div><b>العائلة / Famille:</b> <span class="fr-text">${p.family}</span></div>
                    <div><b>تاريخ ومكان الولادة:</b> <span class="fr-text">${p.dob} - ${p.pob}</span></div>
                    <div><b>اسم الأب:</b> <span class="fr-text">${p.pere}</span></div>
                    <div><b>اسم الأم:</b> <span class="fr-text">${p.mere}</span></div>
                    <div><b>رقم الجواز:</b> <span class="fr-text">${p.pass || 'N/A'}</span></div>
                    <div><b>حالة الجواز:</b> <span class="fr-text" style="color: ${p.statut.includes('Valide')?'green':'red'}; font-weight:bold;">${p.statut}</span></div>
                    <div style="grid-column: span 2;"><b>العنوان في سوريا:</b> ${p.address}</div>
                </div>
                <div class="no-print" style="margin-top: 30px; text-align: center;">
                    <a href="card.html?id=${p.id}" class="btn btn-primary">إصدار البطاقة القنصلية</a>
                    <button class="btn btn-dark" onclick="window.print()">طباعة البروفايل</button>
                </div>
            `;
        }
    </script>
</body>
</html>
