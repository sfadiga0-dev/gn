<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - القنصلية الفخرية لجمهورية غينيا في سوريا</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-body">
        <div class="login-card">
            <img src="Coat_of_Arms_of_Guinea.svg_3.webp" alt="شعار غينيا">
            <h2>بوابة الإدارة القنصلية</h2>
            <p>القنصلية الفخرية لجمهورية غينيا - دمشق</p>
            
            <form onsubmit="handleLogin(event)">
                <div class="form-group" style="text-align: right;">
                    <label>اسم المستخدم (الأدمن)</label>
                    <input type="text" class="form-control" value="Admin" required>
                </div>
                <div class="form-group" style="text-align: right;">
                    <label>كلمة المرور</label>
                    <input type="password" class="form-control" value="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;">تسجيل الدخول للنظام</button>
            </form>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
