<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>البوابة القنصلية - غينيا</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-box { max-width: 400px; margin: 100px auto; text-align: center; }
        .login-box input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        .login-box button { width: 95%; padding: 10px; font-size: 16px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container login-box">
        <h2 style="color: var(--primary);">🇬🇳 النظام القنصلي 🇬🇳</h2>
        <p>الجمهورية الغينية - الجالية في سوريا</p>
        
        <input type="text" id="username" placeholder="اسم المستخدم (مثال: admin أو اسم العائلة)">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button class="btn btn-primary" onclick="login()">تسجيل الدخول</button>
    </div>

    <script src="app.js"></script>
    <script>
        function login() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();

            if (u === 'admin' && p === 'admin123') {
                sessionStorage.setItem('sessionUser', JSON.stringify({role: 'admin', name: 'Hassan Jawad'}));
                window.location.href = 'admin.html';
            } else if (u === 'consul' && p === 'consul123') {
                sessionStorage.setItem('sessionUser', JSON.stringify({role: 'consul', name: 'Consulat'}));
                window.location.href = 'consul.html';
            } else if (p === '1234' && u !== '') { 
                // العائلات تدخل باسم العائلة (مثل: Camara) وكلمة السر 1234
                sessionStorage.setItem('sessionUser', JSON.stringify({role: 'family', name: u}));
                window.location.href = 'family.html';
            } else {
                alert("بيانات الدخول غير صحيحة!");
            }
        }
    </script>
</body>
</html>
