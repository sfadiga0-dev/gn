<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول | القنصلية الفخرية لغينيا</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <img src="Coat_of_Arms_of_Guinea.svg_3.webp" alt="شعار غينيا">
            <h2 style="color: var(--dark); margin-bottom: 5px;">نظام الإدارة القنصلية</h2>
            <p style="color: #7f8c8d; font-size: 14px; margin-bottom: 20px;">القنصلية الفخرية لجمهورية غينيا بدمشق</p>
            
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <input type="text" class="form-control" placeholder="اسم المستخدم" required>
                </div>
                <div class="form-group">
                    <input type="password" class="form-control" placeholder="كلمة المرور" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">دخول النظام</button>
            </form>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
