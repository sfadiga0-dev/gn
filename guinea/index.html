<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail d'Identification</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; height: 100vh; background: #0f172a; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 400px; text-align: center; position: relative; overflow: hidden; }
        .login-box img { height: 80px; margin-bottom: 15px; position: relative; z-index: 1; }
        .login-box h2 { color: #0f172a; margin-bottom: 5px; font-size: 22px; position: relative; z-index: 1; }
        .login-box p { color: #64748b; margin-bottom: 25px; font-size: 14px; position: relative; z-index: 1; }
        .input-group { margin-bottom: 15px; text-align: left; position: relative; z-index: 1; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; transition: 0.3s; }
        .input-group input:focus { border-color: #eab308; outline: none; box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.2); }
        .btn-login { width: 100%; padding: 12px; font-size: 16px; margin-top: 10px; position: relative; z-index: 1; }
        .bg-watermark { position: absolute; top: -10%; right: -10%; width: 150%; opacity: 0.05; z-index: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div class="login-box" dir="ltr">
        <img src="image_5321de.png" class="bg-watermark">
        <img src="image_5321de.png" alt="Logo">
        <h2>Système de Gestion</h2>
        <p dir="rtl">بوابة الوصول الموحدة</p>
        
        <div class="input-group">
            <input type="text" id="username" placeholder="Nom d'utilisateur / اسم المستخدم" required>
        </div>
        <div class="input-group">
            <input type="password" id="password" placeholder="Mot de passe / كلمة المرور" required>
        </div>
        <button class="btn btn-primary btn-login" onclick="handleLogin()">Connexion / دخول</button>
    </div>

    <script src="app.js"></script>
    <script>
        // منع العودة لصفحة الدخول إذا كان المستخدم مسجلاً
        if(localStorage.getItem('role') === 'admin') window.location.href = 'admin.html';
        else if(localStorage.getItem('role') === 'family') window.location.href = 'family.html';
    </script>
</body>
</html>
