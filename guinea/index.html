<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البوابة القنصلية - جمهورية غينيا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex items-center justify-center min-h-screen relative" x-data="{ showPinModal: false, pin: '', error: false }">
    <div class="flag-strip"></div>
    <img src="image_5321de.png" class="global-watermark opacity-20" alt="Watermark">

    <div class="glass-panel p-12 text-center max-w-lg w-full relative z-10">
        <img src="image_5321de.png" class="h-32 mx-auto mb-6" alt="Logo">
        <h1 class="text-3xl font-bold text-white mb-2">سفارة جمهورية غينيا</h1>
        <h2 class="text-lg mb-10" style="color: var(--gn-yellow);">بوابة السجل القنصلي الرقمي</h2>

        <div class="space-y-4">
            <a href="consul.html" class="block w-full py-4 bg-gn-green hover:bg-green-700 text-white font-bold rounded-xl transition-all shadow-lg text-lg">
                دخول القنصل (استعراض وطباعة)
            </a>
            
            <button @click="showPinModal = true" class="block w-full py-4 bg-gray-800 hover:bg-gray-700 text-white font-bold rounded-xl transition-all border border-gray-600">
                لوحة الإدارة والتعديل
            </button>
        </div>
    </div>

    <!-- نافذة إدخال رمز المرور -->
    <div x-show="showPinModal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50" style="display: none;">
        <div class="glass-panel p-8 max-w-sm w-full text-center">
            <h3 class="text-xl font-bold text-white mb-4">أدخل رمز المرور الإداري</h3>
            <input type="password" x-model="pin" class="input-field text-center text-2xl tracking-widest mb-4" placeholder="••••" @keyup.enter="checkPin()">
            <p x-show="error" class="text-red-400 text-sm mb-4">الرمز غير صحيح، حاول مجدداً.</p>
            <div class="flex gap-2">
                <button @click="checkPin()" class="flex-1 bg-gn-red text-white py-2 rounded font-bold">دخول</button>
                <button @click="showPinModal = false; pin = ''; error = false" class="flex-1 bg-gray-600 text-white py-2 rounded">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('gateway', () => ({
                checkPin() {
                    if (this.pin === '2026') {
                        window.location.href = 'admin.html';
                    } else {
                        this.error = true;
                        this.pin = '';
                    }
                }
            }))
        })
    </script>
</body>
</html>
