<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرر الأخبار والبيانات الصحفية</title>
    <style>
        :root {
            --panel-width: 320px;
            --primary: #c0392b; /* أحمر يعكس هوية غينيا */
            --secondary: #2c3e50;
            --bg-color: #f4f6f7;
            --guinea-red: #CE1126;
            --guinea-yellow: #FCD116;
            --guinea-green: #009460;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
        }

        /* اللوحة الجانبية */
        #control-panel {
            width: var(--panel-width);
            background: var(--secondary);
            color: white;
            height: 100vh;
            position: fixed; top: 0; left: 0;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
            z-index: 100;
        }

        .panel-section { margin-bottom: 25px; background: rgba(0,0,0,0.1); padding: 15px; border-radius: 8px; }
        .panel-section h3 { margin-top: 0; font-size: 15px; border-bottom: 1px solid #7f8c8d; padding-bottom: 10px; }
        
        .btn-action { 
            display: block; width: 100%; padding: 10px; margin-bottom: 10px; 
            border: none; border-radius: 4px; cursor: pointer; font-weight: bold; 
            transition: 0.3s; color: white; text-align: center; text-decoration: none;
        }
        .btn-back { background: var(--guinea-red); }
        .btn-print { background: var(--guinea-green); }
        .btn-word { background: #2980b9; }
        .btn-action:hover { filter: brightness(1.1); }

        .form-input {
            width: 100%; padding: 8px; margin-bottom: 12px;
            border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
        }

        /* مساحة العمل */
        #paper-container { 
            margin-left: var(--panel-width); 
            flex-grow: 1; 
            display: flex; flex-direction: column; align-items: center; 
            padding: 75px 20px 40px 20px; 
        }
        
        /* شريط الأدوات */
        .word-toolbar {
            position: fixed; top: 0; left: var(--panel-width); right: 0; height: 55px; 
            background: white; border-bottom: 1px solid #ddd; 
            display: flex; align-items: center; padding: 0 15px; gap: 8px; z-index: 99;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .word-toolbar button { padding: 6px 10px; background: #eee; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; }
        .word-toolbar button:hover { background: var(--primary); color: white; }

        /* الورقة A4 */
        #paper { 
            width: 210mm; min-height: 297mm; 
            background-color: #ffffff; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.15); 
            padding: 15mm; box-sizing: border-box; 
            position: relative; z-index: 1;
            display: flex; flex-direction: column;
            font-size: 13pt; line-height: 1.6;
        }

        /* العلامة المائية (خريطة غينيا) */
        #paper::before {
            content: ""; position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('images_2.jfif'); /* تم استخدام صورة الخريطة هنا */
            background-position: center; background-repeat: no-repeat;
            background-size: 50%; opacity: 0.05; z-index: -1; pointer-events: none; 
        }

        /* الترويسة المخصصة باستخدام الصور المطلوبة */
        .custom-letterhead {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px double var(--guinea-red);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        
        .header-left img {
            width: 90px;
            height: 110px;
            object-fit: cover;
            border-radius: 4px;
            border: 2px solid #ddd;
        }

        .header-center {
            text-align: center;
            flex-grow: 1;
            padding: 0 15px;
        }
        .header-center h2 { margin: 0; font-size: 16pt; color: #222; font-family: 'Times New Roman', serif; letter-spacing: 1px;}
        .motto { font-size: 10pt; font-weight: bold; margin: 5px 0; }
        .motto .red { color: var(--guinea-red); }
        .motto .yellow { color: #d4ac0d; } /* لون أصفر غامق قليلاً ليكون مقروءاً */
        .motto .green { color: var(--guinea-green); }
        
        .header-center .coat-of-arms { width: 70px; height: auto; margin: 5px 0; }
        
        .header-center h3 { margin: 0; font-size: 14pt; color: #333; }
        .header-center h4 { margin: 2px 0 0 0; font-size: 11pt; color: #555; font-weight: normal;}

        .header-right img {
            width: 100px;
            height: auto;
            object-fit: contain;
        }

        /* محتوى الخبر */
        .news-title-display {
            text-align: center;
            font-size: 18pt;
            font-weight: bold;
            color: var(--guinea-red);
            margin-bottom: 15px;
            text-decoration: underline;
        }
        
        .news-date-display {
            text-align: left;
            font-size: 11pt;
            color: #666;
            margin-bottom: 20px;
            direction: ltr;
        }

        .document-body { flex-grow: 1; outline: none; text-align: justify; }

        @media print {
            body { background-color: #fff; }
            #control-panel, .word-toolbar, .no-print-btn { display: none !important; }
            #paper-container { margin: 0 !important; padding: 0 !important; width: 100%; display: block; }
            #paper { box-shadow: none !important; width: 100% !important; padding: 10mm !important; }
            @page { size: A4 portrait; margin: 5mm; }
        }
    </style>
</head>
<body>

    <div id="control-panel" class="no-print-btn">
        <div class="panel-section" style="background: none; padding: 0;">
            <a href="admin.html" class="btn-action btn-back">🔙 العودة للوحة الإدارة</a>
        </div>

        <div class="panel-section">
            <h3>📰 إعدادات الخبر / البيان</h3>
            <label>عنوان الخبر (الرئيسي):</label>
            <input type="text" id="news-title-input" class="form-input" placeholder="مثال: زيارة وفد دبلوماسي..." onkeyup="updateNewsFields()">
            
            <label>التاريخ:</label>
            <input type="date" id="news-date-input" class="form-input" onchange="updateNewsFields()">
            
            <label>نوع الإصدار:</label>
            <select class="form-input" id="news-type" onchange="updateNewsFields()">
                <option value="بيان صحفي">بيان صحفي</option>
                <option value="خبر عاجل">خبر عاجل</option>
                <option value="إعلان هام">إعلان هام</option>
                <option value="تعميم">تعميم</option>
            </select>
        </div>

        <div class="panel-section">
            <h3>🖨️ التصدير والطباعة</h3>
            <button onclick="window.print()" class="btn-action btn-print">🖨️ طباعة أو تصدير PDF</button>
            <button onclick="exportToWord()" class="btn-action btn-word">📝 تصدير كملف Word</button>
        </div>
    </div>

    <div id="paper-container">
        
        <div class="word-toolbar no-print-btn">
            <button onclick="formatDoc('bold')" title="عريض"><b>B</b></button>
            <button onclick="formatDoc('italic')" title="مائل"><i>I</i></button>
            <button onclick="formatDoc('underline')" title="تسطير"><u>U</u></button>
            <span style="color:#ccc">|</span>
            <button onclick="formatDoc('justifyLeft')">يسار</button>
            <button onclick="formatDoc('justifyCenter')">وسط</button>
            <button onclick="formatDoc('justifyRight')">يمين</button>
            <button onclick="formatDoc('justifyFull')">ضبط (Justify)</button>
            <span style="color:#ccc">|</span>
            <button onclick="formatDoc('insertUnorderedList')">قائمة نقطية</button>
            <button onclick="formatDoc('insertOrderedList')">قائمة رقمية</button>
        </div>

        <div id="paper">
            
            <!-- الترويسة المبنية من الصور (الهوية البصرية المطلوبة) -->
            <div class="custom-letterhead" contenteditable="false">
                <div class="header-left">
                    <img src="IMG_5442-750x750_3.jpeg" alt="صورة فخامة الرئيس">
                </div>
                <div class="header-center">
                    <h2>RÉPUBLIQUE DE GUINÉE</h2>
                    <div class="motto">
                        <span class="red">Travail</span> - <span class="yellow">Justice</span> - <span class="green">Solidarité</span>
                    </div>
                    <img src="Coat_of_Arms_of_Guinea.svg_3.webp" alt="شعار غينيا" class="coat-of-arms">
                    <h3>القنصلية الفخرية لجمهورية غينيا بدمشق</h3>
                    <h4>Consulat Honoraire de la République de Guinée à Damas</h4>
                </div>
                <div class="header-right">
                    <img src="image_f24543.png" alt="شعار إضافي أو علم">
                </div>
            </div>

            <!-- معلومات الخبر -->
            <div class="news-date-display" id="display-date">Damas, le: __/__/202_</div>
            <div class="news-title-display" id="display-title">بيان صحفي</div>

            <!-- جسم الخبر -->
            <div class="document-body" contenteditable="true">
                <p>اكتب نص البيان الصحفي أو الخبر هنا...</p>
            </div>
            
        </div>
    </div>

    <script>
        // تحديث العنوان والتاريخ مباشرة على الورقة
        function updateNewsFields() {
            let title = document.getElementById('news-title-input').value;
            let date = document.getElementById('news-date-input').value;
            let type = document.getElementById('news-type').value;

            // تنسيق العنوان
            let displayTitle = type;
            if (title.trim() !== "") displayTitle += ": " + title;
            document.getElementById('display-title').innerText = displayTitle;

            // تنسيق التاريخ
            if(date) {
                let d = new Date(date);
                let formattedDate = d.toLocaleDateString('fr-FR');
                document.getElementById('display-date').innerText = "Damas, le: " + formattedDate;
            }
        }

        // تنسيق النصوص
        function formatDoc(command, value) {
            document.querySelector('.document-body').focus();
            document.execCommand(command, false, value || null);
        }

        // التصدير إلى وورد
        function exportToWord() {
            var header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Export News</title></head><body>";
            var footer = "</body></html>";
            var sourceHTML = header + document.getElementById("paper").innerHTML + footer;
            var source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
            var fileDownload = document.createElement("a");
            document.body.appendChild(fileDownload);
            fileDownload.href = source;
            fileDownload.download = 'News_Press_Release.doc';
            fileDownload.click();
            document.body.removeChild(fileDownload);
        }

        // تعيين تاريخ اليوم كافتراضي عند التحميل
        window.onload = function() {
            let today = new Date().toISOString().split('T')[0];
            document.getElementById('news-date-input').value = today;
            updateNewsFields();
        };
    </script>
</body>
</html>
