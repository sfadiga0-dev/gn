<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرر الوثائق القنصلية</title>
    <style>
        :root {
            --panel-width: 320px;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
        }

        /* تنسيقات اللوحة الجانبية */
        #control-panel {
            width: var(--panel-width);
            background: #2f3640;
            color: white;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
            z-index: 100;
        }

        .panel-section { margin-bottom: 25px; }
        .panel-section h3 { margin-top: 0; font-size: 15px; border-bottom: 1px solid #718093; padding-bottom: 10px; color: #f5f6fa; }
        
        .editor-btn { display: inline-block; padding: 8px 12px; margin: 4px 2px; border: none; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 13px; text-align: center; box-sizing: border-box; transition: background 0.3s; }
        .editor-btn:hover { filter: brightness(1.1); }
        .btn-group { display: flex; flex-wrap: wrap; gap: 4px; }
        .btn-lang { background: #718093; color: white; flex-grow: 1; }
        .btn-lang.active { background: #44bd32; font-weight: bold; }
        .btn-primary { background: #0097e6; color: white; }
        .btn-word { background: #273c75; color: white; }
        
        .editor-select { width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #ccc; font-family: inherit; font-size: 13px; }
        
        .form-input {
            width: 100%;
            padding: 7px 10px;
            margin-bottom: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 12px;
            box-sizing: border-box;
            font-family: inherit;
        }

        /* تنسيقات شريط الأدوات العلوي */
        .word-toolbar {
            position: fixed; 
            top: 0; 
            left: var(--panel-width); 
            right: 0; 
            height: 55px; 
            background-color: #ffffff;
            border-bottom: 1px solid #dcdde1; 
            display: flex; 
            align-items: center; 
            padding: 0 15px; 
            gap: 8px; 
            z-index: 99;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .word-toolbar button, .word-toolbar select { padding: 6px 10px; background: #f5f6fa; border: 1px solid #dcdde1; border-radius: 4px; cursor: pointer; font-size: 13px; transition: background 0.2s;}
        .word-toolbar button:hover { background: #e84118; color: white; border-color: #e84118; }
        .tool-separator { color: #ced6e0; margin: 0 4px; }
        
        /* تنسيقات الورقة ومساحة العمل */
        #paper-container { 
            margin-left: var(--panel-width); 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 75px 20px 40px 20px; 
            min-height: 100vh; 
            box-sizing: border-box;
        }
        
        #paper { 
            width: 210mm; 
            min-height: 297mm; 
            background-color: #ffffff; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.15); 
            padding: 8mm 12mm 10mm 12mm; 
            box-sizing: border-box; 
            outline: none; 
            position: relative; 
            z-index: 1;
            display: flex; 
            flex-direction: column;
            font-size: 11.5pt; 
            line-height: 1.4;
        }

        /* العلامة المائية */
        #paper::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('image_5321dee.png'); /* تأكد من وجود الصورة بنفس المسار */
            background-position: center 50%;
            background-repeat: no-repeat;
            background-size: 60%; 
            opacity: 0.10; 
            z-index: -1;
            pointer-events: none; 
        }

        .letterhead-header { 
            text-align: center; 
            border-bottom: 2px solid #000; 
            padding-bottom: 6px; 
            margin-bottom: 12px; 
        }
        #header-image { 
            width: 100%; 
            max-width: 100%; 
            height: auto; 
            max-height: 190px; 
            object-fit: contain;
            display: block; 
            margin: 0 auto; 
        }

        .rtl { direction: rtl; text-align: right; }
        .ltr { direction: ltr; text-align: left; }
        
        .document-body { 
            flex-grow: 1; 
            outline: none; 
        } 
        .document-body p {
            margin-top: 0;
            margin-bottom: 8px;
        }

        /* تنسيق جدول إخراج القيد المزدوج */
        .attestation-table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }
        .attestation-table td {
            padding: 6px 0;
            vertical-align: top;
            font-size: 11pt;
        }
        
        /* التوقيع */
        .signature-wrapper {
            margin-top: 15px;
            width: 100%;
            page-break-inside: avoid;
        }
        .signature-content {
            display: inline-block;
            text-align: center;
            font-size: 13.5pt;
            font-weight: bold;
            line-height: 1.35;
        }

        /* إعدادات الطباعة */
        @media print {
            body { background-color: #fff; }
            #control-panel, .word-toolbar, .no-print-btn { display: none !important; }
            #paper-container { margin: 0 !important; padding: 0 !important; width: 100%; display: block; }
            #paper { 
                box-shadow: none !important; 
                width: 100% !important; 
                height: 100% !important;
                min-height: 297mm !important;
                padding: 6mm 10mm !important; 
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            @page { size: A4 portrait; margin: 6mm; }
        }
    </style>
</head>
<body>

    <!-- اللوحة الجانبية (أدوات التحكم) -->
    <div id="control-panel" class="no-print-btn">
        <div class="panel-section" style="text-align: center;">
            <a href="admin.html" class="editor-btn" style="background-color: #CE1126; color: white; display: block; text-decoration: none; padding: 10px; font-weight: bold;">🔙 العودة للوحة الإدارة</a>
        </div>

        <div class="panel-section">
            <h3>🎛️ إدارة الوثيقة واللغة</h3>
            <div class="btn-group">
                <button onclick="setLanguage('ar')" class="editor-btn btn-lang active" id="btn-ar">العربية</button>
                <button onclick="setLanguage('fr')" class="editor-btn btn-lang" id="btn-fr">Français</button>
                <button onclick="setLanguage('en')" class="editor-btn btn-lang" id="btn-en">English</button>
                <button onclick="setLanguage('bi')" class="editor-btn btn-lang" id="btn-bi" style="width: 100%;">مزدوج (عربي/فرنسي)</button>
            </div>
            <div class="btn-group" style="margin-top: 10px;">
                <button onclick="window.print()" class="editor-btn btn-primary" style="width: 100%;">🖨️ طباعة المستند / تصدير PDF</button>
                <button onclick="exportToWord()" class="editor-btn btn-word" style="width: 100%;">📝 تصدير كملف Word</button>
            </div>
        </div>

        <div class="panel-section">
            <h3>📊 القوالب المستندية</h3>
            <select class="editor-select" id="template-select" onchange="handleTemplateChange(this.value)">
                <option value="">-- اختر تقرير أو مستند --</option>
                <option value="attestation_birth">📜 إخراج قيد / شهادة ولادة (عربي/فرنسي)</option>
                <option value="report_min_ar">📄 تقرير - معالي الوزير (عربي)</option>
                <option value="report_min_fr">📄 Rapport - Ministre (Français)</option>
                <option value="blank">📝 ورقة فارغة جديدة</option>
            </select>
        </div>

        <!-- قسم تعبئة إخراج القيد التلقائي -->
        <div class="panel-section" id="quick-fill-section">
            <h3>⚡ تعبئة إخراج القيد سريعاً</h3>
            <input type="text" id="fill-name-ar" class="form-input" placeholder="الاسم والكنية (عربي)">
            <input type="text" id="fill-name-fr" class="form-input" placeholder="Nom et Prénom (فرنسي)">
            <input type="text" id="fill-dob" class="form-input" placeholder="تاريخ الولادة (مثال: 15/05/1990)">
            <input type="text" id="fill-pob-ar" class="form-input" placeholder="مكان الولادة (مثال: دمشق - سورية)" value="دمشق - سورية">
            <input type="text" id="fill-father-ar" class="form-input" placeholder="اسم الأب (عربي)">
            <input type="text" id="fill-father-fr" class="form-input" placeholder="Nom du père (فرنسي)">
            <input type="text" id="fill-mother-ar" class="form-input" placeholder="اسم الأم (عربي)">
            <input type="text" id="fill-mother-fr" class="form-input" placeholder="Nom de la mère (فرنسي)">
            <input type="text" id="fill-passport" class="form-input" placeholder="رقم جواز السفر">
            <button onclick="applyQuickFill()" class="editor-btn btn-primary" style="width: 100%; margin-top: 8px; font-weight: bold;">✔️ توليد إخراج القيد</button>
        </div>
    </div>

    <!-- مساحة العمل والورقة -->
    <div id="paper-container">
        
        <!-- شريط أدوات التنسيق العلوي -->
        <div class="word-toolbar no-print-btn">
            <select onchange="formatDoc('fontName', this.value); this.selectedIndex=0;">
                <option value="">🔤 الخط</option>
                <option value="Times New Roman">Times New Roman</option>
                <option value="Arial">Arial</option>
                <option value="Tahoma">Tahoma</option>
            </select>
            <select onchange="formatDoc('fontSize', this.value); this.selectedIndex=0;">
                <option value="">📏 الحجم</option>
                <option value="3">عادي (12pt)</option>
                <option value="4">متوسط (14pt)</option>
                <option value="5">كبير (16pt)</option>
                <option value="6">ضخم (18pt)</option>
            </select>
            <span class="tool-separator">|</span>
            <button onclick="formatDoc('bold')" title="عريض"><b>B</b></button>
            <button onclick="formatDoc('italic')" title="مائل"><i>I</i></button>
            <button onclick="formatDoc('underline')" title="تسطير"><u>U</u></button>
            <span class="tool-separator">|</span>
            <button onclick="formatDoc('justifyLeft')" title="محاذاة لليسار">Left</button>
            <button onclick="formatDoc('justifyCenter')" title="توسيط">Center</button>
            <button onclick="formatDoc('justifyRight')" title="محاذاة لليمين">Right</button>
            <span class="tool-separator">|</span>
            <button onclick="formatDoc('undo')" title="تراجع">↩️</button>
            <button onclick="formatDoc('redo')" title="إعادة">↪️</button>
        </div>

        <!-- الورقة (A4) -->
        <div id="paper" class="rtl">
            <div class="letterhead-header" contenteditable="false">
                <!-- الترويسة الدبلوماسية -->
                <img src="IMG_20260615_123419.jpg" alt="Embassy Letterhead" id="header-image">
            </div>

            <!-- جسم المستند (قابل للتعديل) -->
            <div class="document-body" contenteditable="true" onclick="clearPlaceholder()">
                <p class="placeholder-text" style="color: #7f8c8d; text-align: center; margin-top: 20px;">أهلاً بك في محرر الوثائق؛ الرجاء اختيار قالب من اللوحة الجانبية، أو ابدأ الكتابة هنا...</p>
            </div>

            <!-- التوقيع الرسمي (محمي من التعديل) -->
            <div id="signature-wrapper" class="signature-wrapper" contenteditable="false">
                <div id="official-signature" class="signature-content">
                    <!-- التوقيع يتغير تلقائياً حسب اللغة -->
                </div>
            </div>
        </div>
    </div>

    <!-- السكربتات والأوامر البرمجية -->
    <script>
        // دالة تغيير اللغة وضبط التنسيقات والتوقيع
        function setLanguage(lang) {
            var paper = document.getElementById('paper');
            var buttons = document.querySelectorAll('.btn-lang');
            
            var sigWrapper = document.getElementById('signature-wrapper');
            var sigContent = document.getElementById('official-signature');

            buttons.forEach(btn => btn.classList.remove('active'));
            var activeBtn = document.getElementById('btn-' + lang);
            if (activeBtn) activeBtn.classList.add('active');

            if (lang === 'ar') {
                paper.className = 'rtl';
                paper.style.textAlign = 'right';
                sigWrapper.style.textAlign = 'left';
                sigContent.innerHTML = 'د. حسن جواد<br>القنصل الفخري لجمهورية غينيا';
            } else if (lang === 'fr') {
                paper.className = 'ltr';
                paper.style.textAlign = 'left';
                sigWrapper.style.textAlign = 'right';
                sigContent.innerHTML = 'Dr Hassan Jawad<br>Consul Honoraire de la République de Guinée';
            } else if (lang === 'en') {
                paper.className = 'ltr';
                paper.style.textAlign = 'left';
                sigWrapper.style.textAlign = 'right';
                sigContent.innerHTML = 'Dr. Hassan Jawad<br>Honorary Consul of the Republic of Guinea';
            } else if (lang === 'bi') {
                paper.className = 'rtl';
                paper.style.textAlign = 'right';
                sigWrapper.style.textAlign = 'left'; // التوقيع في الجهة اليسرى (الفرنسية)
                sigContent.innerHTML = 'Dr. Hassan Jawad / د. حسن جواد<br>Consul Honoraire / القنصل الفخري';
            }
        }

        // تهيئة اللغة العربية كافتراضية عند التحميل
        window.onload = function() {
            setLanguage('ar');
        };

        // دالة تنسيق النصوص (شريط الأدوات)
        function formatDoc(command, value) {
            document.querySelector('.document-body').focus();
            document.execCommand(command, false, value || null);
        }

        // إزالة النص الافتراضي عند بدء الكتابة
        function clearPlaceholder() {
            var body = document.querySelector('.document-body');
            var placeholder = body.querySelector('.placeholder-text');
            if (placeholder) { body.innerHTML = '<p></p>'; }
        }

        // دالة إنشاء كود HTML لشهادة الميلاد/إخراج القيد المزدوج
        function generateAttestationHTML(data) {
            var nameFr = data.nameFr || '.......................';
            var nameAr = data.nameAr || '.......................';
            var dob = data.dob || '..../..../........';
            var pobAr = data.pobAr || 'دمشق - سورية';
            var fatherFr = data.fatherFr || '.......................';
            var fatherAr = data.fatherAr || '.......................';
            var motherFr = data.motherFr || '.......................';
            var motherAr = data.motherAr || '.......................';
            var passport = data.passport || '.......................';

            return `
                <div style="text-align: center; margin-bottom: 15px;">
                    <h2 style="margin: 0; font-size: 16pt; font-weight: bold; font-family: 'Times New Roman', serif;">ATTESTATION DE NAISSANCE</h2>
                    <h3 style="margin: 4px 0 0 0; font-size: 14pt; font-weight: bold;">إخراج قيد / شهادة ولادة</h3>
                </div>

                <div style="display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 10.5pt; line-height: 1.5;">
                    <div style="width: 49%; text-align: left; direction: ltr;">
                        <u>Le Consulat Honoraire de la République de Guinée à Damas atteste par la présente sur la foi des renseignements recueillis:</u>
                    </div>
                    <div style="width: 49%; text-align: right; direction: rtl;">
                        <u>تشهد القنصلية الفخرية لجمهورية غينيا بدمشق بموجب هذا المستند وبناءً على المعلومات التي تم جمعها بما يلي:</u>
                    </div>
                </div>

                <table class="attestation-table">
                    <tr>
                        <td style="width: 50%; text-align: left; direction: ltr;">Que / Nom et Prénom: <b>${nameFr}</b></td>
                        <td style="width: 50%; text-align: right; direction: rtl;">الإسم والكنية: <b>${nameAr}</b></td>
                    </tr>
                    <tr>
                        <td style="text-align: left; direction: ltr;">Est né / Né le: <b>${dob}</b></td>
                        <td style="text-align: right; direction: rtl;">تاريخ الولادة: <b>${dob}</b></td>
                    </tr>
                    <tr>
                        <td style="text-align: left; direction: ltr;">À / Lieu de naissance: <b>DAMAS - Syrie</b></td>
                        <td style="text-align: right; direction: rtl;">مكان الولادة: <b>${pobAr}</b></td>
                    </tr>
                    <tr>
                        <td style="text-align: left; direction: ltr;">Région Administrative de: <b>DAMAS-Syrie</b></td>
                        <td style="text-align: right; direction: rtl;">أمانة السجل المدني في: <b>دمشق</b></td>
                    </tr>
                    <tr>
                        <td style="text-align: left; direction: ltr;">Nationalité: <b>Guinéenne</b></td>
                        <td style="text-align: right; direction: rtl;">الجنسية: <b>غينية</b></td>
                    </tr>
                    <tr>
                        <td style="text-align: left; direction: ltr;">Fils de / Nom du père: <b>${fatherFr}</b></td>
                        <td style="text-align: right; direction: rtl;">اسم الأب: <b>${fatherAr}</b></td>
                    </tr>
                    <tr>
                        <td style="text-align: left; direction: ltr;">Et de / Nom de la mère: <b>${motherFr}</b></td>
                        <td style="text-align: right; direction: rtl;">اسم الأم: <b>${motherAr}</b></td>
                    </tr>
                    <tr>
                        <td style="text-align: left; direction: ltr;">Demeurant à: <b>DAMAS-République Arabe Syrienne</b></td>
                        <td style="text-align: right; direction: rtl;">مكان الإقامة: <b>دمشق - الجمهورية العربية السورية</b></td>
                    </tr>
                    <tr>
                        <td style="text-align: left; direction: ltr;">Passeport NO.: <b>${passport}</b></td>
                        <td style="text-align: right; direction: rtl;">رقم جواز السفر: <b>${passport}</b></td>
                    </tr>
                </table>

                <div style="display: flex; justify-content: space-between; margin-top: 15px; font-size: 10.5pt; line-height: 1.4;">
                    <div style="width: 49%; text-align: left; direction: ltr;">
                        En foi de quoi, lui a été délivrée la présente attestation pour servir et valoir ce que de droit.
                    </div>
                    <div style="width: 49%; text-align: right; direction: rtl;">
                        وبناءً عليه، مُنحت هذه الشهادة لصاحبها لاستخدامها وتوطيدها فيما يقتضيه القانون.
                    </div>
                </div>
            `;
        }

        // القوالب الجاهزة
        var templates = {
            blank: { lang: 'ar', content: '<p></p>' },
            attestation_birth: {
                lang: 'bi',
                content: generateAttestationHTML({})
            },
            report_min_ar: {
                lang: 'ar',
                content: '<table style="width: 100%; border: none; margin-bottom: 12px;"><tr><td style="text-align: right; font-size: 13px;"><b>الرقم:</b> Ref.N199/MIN</td><td style="text-align: left; font-size: 13px;"><b>التاريخ:</b> 31 / 07 / 2026</td></tr></table><div style="text-align: center; margin-bottom: 16px; line-height: 1.4;"><span style="font-size: 16px; font-weight: bold;">معالي الدكتور موريساندا كوياتي</span><br><span style="font-size: 14px; font-weight: bold;">وزير الشؤون الخارجية والاندماج الأفريقي والغينيين في الخارج</span></div><p><b>الموضوع: التقرير الدوري لأعمال القنصلية الفخرية لجمهورية غينيا بدمشق</b></p><p>نص التقرير يكتب هنا...</p>'
            },
            report_min_fr: {
                lang: 'fr',
                content: '<table style="width: 100%; border: none; margin-bottom: 12px;"><tr><td style="text-align: left; font-size: 13px;"><b>Réf:</b> N199/MIN</td><td style="text-align: right; font-size: 13px;"><b>Date:</b> 31 / 07 / 2026</td></tr></table><div style="text-align: center; margin-bottom: 16px; line-height: 1.4;"><span style="font-size: 16px; font-weight: bold;">S.E. Dr. Morissanda Kouyaté</span><br><span style="font-size: 14px; font-weight: bold;">Ministre des Affaires Etrangères, de l\'Intégration Africaine et des Guinéens établis à l\'Etranger</span></div><p><b>Objet: Rapport Périodique...</b></p><p>Le contenu du rapport est écrit ici...</p>'
            }
        };

        // تغيير القالب عند الاختيار من القائمة
        function handleTemplateChange(val) {
            if (!val) return;
            var tmpl = templates[val];
            if (tmpl) {
                setLanguage(tmpl.lang);
                document.querySelector('.document-body').innerHTML = tmpl.content;
            }
        }

        // سحب البيانات من النموذج السريع وتوليد إخراج القيد
        function applyQuickFill() {
            var data = {
                nameAr: document.getElementById('fill-name-ar').value.trim(),
                nameFr: document.getElementById('fill-name-fr').value.trim(),
                dob: document.getElementById('fill-dob').value.trim(),
                pobAr: document.getElementById('fill-pob-ar').value.trim(),
                fatherAr: document.getElementById('fill-father-ar').value.trim(),
                fatherFr: document.getElementById('fill-father-fr').value.trim(),
                motherAr: document.getElementById('fill-mother-ar').value.trim(),
                motherFr: document.getElementById('fill-mother-fr').value.trim(),
                passport: document.getElementById('fill-passport').value.trim()
            };

            setLanguage('bi');
            document.getElementById('template-select').value = 'attestation_birth';
            document.querySelector('.document-body').innerHTML = generateAttestationHTML(data);
        }

        // تصدير الورقة كملف وورد (Word)
        function exportToWord() {
            var header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Export Document</title></head><body>";
            var footer = "</body></html>";
            
            // جلب محتوى الورقة فقط للتصدير
            var sourceHTML = header + document.getElementById("paper").innerHTML + footer;
            
            var source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
            var fileDownload = document.createElement("a");
            document.body.appendChild(fileDownload);
            fileDownload.href = source;
            fileDownload.download = 'Document_Consulaire.doc';
            fileDownload.click();
            document.body.removeChild(fileDownload);
        }
    </script>
</body>
</html>
