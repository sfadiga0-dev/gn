<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرر الوثائق القنصلية</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --panel-width: 340px;
            --accent-color: #009460; 
        }
        body.editor-mode {
            background-color: #f5f6fa;
            color: #2f3640;
            display: flex;
            margin: 0;
            font-family: 'Times New Roman', Times, serif;
        }
        #control-panel {
            width: var(--panel-width);
            height: 100vh;
            background-color: #ffffff;
            border-right: 1px solid #dcdde1;
            box-shadow: 3px 0 6px rgba(0,0,0,0.05);
            padding: 15px;
            position: fixed;
            top: 0; left: 0;
            overflow-y: auto;
            z-index: 100;
        }
        .panel-section { margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px dashed #dcdde1; }
        .panel-section h3 { font-size: 14px; color: var(--accent-color); margin-top: 0; margin-bottom: 10px; font-family: 'Cairo', sans-serif;}
        .btn-group { display: flex; flex-wrap: wrap; gap: 6px; }
        .editor-btn { padding: 8px 10px; border: 1px solid #ccc; background: #f8f9fa; cursor: pointer; border-radius: 4px; font-size: 12px; font-weight: bold; flex: 1 1 auto; text-align: center; }
        .editor-btn:hover { background: #e2e6ea; }
        .btn-primary { background-color: var(--accent-color); color: white; border: none; }
        .btn-word { background-color: #2b579a; color: white; border: none; }
        .btn-lang.active { background-color: #2ecc71; color: white; border-color: #2ecc71; }
        select.editor-select { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #dcdde1; margin-bottom: 8px; font-size: 13px; font-weight: bold; }
        
        .word-toolbar {
            position: fixed; top: 0; left: var(--panel-width); right: 0; height: 50px; background-color: #ffffff;
            border-bottom: 1px solid #dcdde1; display: flex; align-items: center; padding: 0 15px; gap: 6px; z-index: 99;
        }
        .word-toolbar button, .word-toolbar select { padding: 6px; background: white; border: 1px solid #ccc; border-radius: 3px; cursor: pointer; font-size: 12px; }
        .tool-separator { color: #ced6e0; margin: 0 4px; }
        
        #paper-container { margin-left: var(--panel-width); flex-grow: 1; display: flex; flex-direction: column; align-items: center; padding: 75px 20px 40px 20px; min-height: 100vh; }
        
        #paper { 
            width: 210mm; 
            min-height: 297mm; 
            background-color: #ffffff; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
            padding: 20mm 15mm; 
            box-sizing: border-box; 
            outline: none; 
            position: relative; 
            z-index: 1;
            display: flex; 
            flex-direction: column;
            font-size: 12pt; 
            line-height: 1.6;
        }

        #paper::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('image_5321dee.png'); 
            background-position: center 45%;
            background-repeat: no-repeat;
            background-size: 55%; 
            opacity: 0.08; 
            z-index: -1;
            pointer-events: none; 
        }

        .letterhead-header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 12px; margin-bottom: 25px; }
        #header-image { max-height: 120px; display: block; margin: 0 auto; }
        .rtl { direction: rtl; text-align: right; }
        .ltr { direction: ltr; text-align: left; }
        .document-body { flex-grow: 1; outline: none; } 
        
        /* === التنسيقات الجديدة لحل مشكلة التوقيع === */
        /* الحاوية: مسؤولة عن إزاحة التوقيع لليسار أو اليمين */
        .signature-wrapper {
            margin-top: 50px;
            width: 100%;
        }
        
        /* المحتوى: مسؤول عن جعل النص بحد ذاته موسطاً وعريضاً كما في الصورة */
        .signature-content {
            display: inline-block;
            text-align: center;
            font-size: 15pt;
            font-weight: bold;
            line-height: 1.5;
        }

        @media print {
            body { background-color: #fff; }
            #control-panel, .word-toolbar, .no-print-btn { display: none !important; }
            #paper-container { margin: 0 !important; padding: 0 !important; width: 100%; display: block; }
            #paper { 
                box-shadow: none !important; 
                width: 100% !important; 
                height: auto !important; 
                padding: 0 !important; 
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            @page { size: A4; margin: 15mm; }
        }
    </style>
</head>
<body class="editor-mode">

    <div id="control-panel" class="no-print-btn">
        <div class="panel-section" style="text-align: center;">
            <a href="admin.html" class="editor-btn" style="background-color: #CE1126; color: white; display: block; text-decoration: none; padding: 10px;">🔙 العودة للوحة الإدارة</a>
        </div>

        <div class="panel-section">
            <h3>🎛️ إدارة الوثيقة واللغة</h3>
            <div class="btn-group">
                <button onclick="setLanguage('ar')" class="editor-btn btn-lang active" id="btn-ar">العربية</button>
                <button onclick="setLanguage('fr')" class="editor-btn btn-lang" id="btn-fr">Français</button>
                <button onclick="setLanguage('en')" class="editor-btn btn-lang" id="btn-en">English</button>
            </div>
            <div class="btn-group" style="margin-top: 8px;">
                <button onclick="window.print()" class="editor-btn btn-primary" style="width: 100%;">🖨️ طباعة المستند / تصدير PDF</button>
                <button onclick="exportToWord()" class="editor-btn btn-word" style="width: 100%; margin-top: 4px;">📝 تصدير كملف Word</button>
            </div>
        </div>

        <div class="panel-section">
            <h3>📊 التقارير الدورية والمستندات</h3>
            <select class="editor-select" id="template-select" onchange="handleTemplateChange(this.value)">
                <option value="">-- اختر تقرير أو مستند --</option>
                <option value="report_min_ar">تقرير تموز - معالي الوزير (عربي)</option>
                <option value="report_min_fr">Rapport - Ministre (Français)</option>
                <option value="blank">ورقة فارغة جديدة</option>
            </select>
        </div>
    </div>

    <div id="paper-container">
        <div class="word-toolbar no-print-btn">
            <select onchange="formatDoc('fontName', this.value); this.selectedIndex=0;">
                <option value="">🔤 الخط</option>
                <option value="Times New Roman">Times New Roman</option>
                <option value="Arial">Arial</option>
            </select>
            <select onchange="formatDoc('fontSize', this.value); this.selectedIndex=0;">
                <option value="">📏 الحجم</option>
                <option value="3">عادي (12pt)</option>
                <option value="4">متوسط (14pt)</option>
                <option value="5">كبير (16pt)</option>
            </select>
            <span class="tool-separator">|</span>
            <button onclick="formatDoc('bold')"><b>B</b></button>
            <button onclick="formatDoc('italic')"><i>I</i></button>
            <button onclick="formatDoc('underline')"><u>U</u></button>
            <span class="tool-separator">|</span>
            <button onclick="formatDoc('justifyLeft')">Left</button>
            <button onclick="formatDoc('justifyCenter')">Center</button>
            <button onclick="formatDoc('justifyRight')">Right</button>
        </div>

        <div id="paper" class="rtl">
            <div class="letterhead-header" contenteditable="false">
                <!-- الصورة العلوية -->
                <img src="IMG_20260615_123419.jpg" alt="Embassy Letterhead" id="header-image">
            </div>

            <div class="document-body" contenteditable="true" onclick="clearPlaceholder()">
                <p class="placeholder-text">أهلاً بك في المنظومة المحدثة؛ الرجاء اختيار قالب التقرير من اللوحة الجانبية، أو ابدأ الكتابة الحرة مباشرة...</p>
            </div>

            <!-- التوقيع محاط بحاوية مسؤولة عن إزاحته -->
            <div id="signature-wrapper" class="signature-wrapper" contenteditable="false">
                <div id="official-signature" class="signature-content">
                    <!-- التوقيع سيظهر هنا -->
                </div>
            </div>
        </div>
    </div>

    <script>
        function setLanguage(lang) {
            var paper = document.getElementById('paper');
            var buttons = document.querySelectorAll('.btn-lang');
            
            // تعريف الحاوية ومحتوى التوقيع
            var sigWrapper = document.getElementById('signature-wrapper');
            var sigContent = document.getElementById('official-signature');

            buttons.forEach(btn => btn.classList.remove('active'));
            var activeBtn = document.getElementById('btn-' + lang);
            if (activeBtn) activeBtn.classList.add('active');

            if (lang === 'ar') {
                paper.className = 'rtl';
                paper.style.textAlign = 'right';
                // التوقيع يسار الصفحة، والنص موسط داخلياً
                sigWrapper.style.textAlign = 'left';
                sigContent.innerHTML = 'د. حسن جواد<br>القنصل الفخري لجمهورية غينيا';
            } else if (lang === 'fr') {
                paper.className = 'ltr';
                paper.style.textAlign = 'left';
                // التوقيع يمين الصفحة، والنص موسط داخلياً
                sigWrapper.style.textAlign = 'right';
                sigContent.innerHTML = 'Dr Hassan Jawad<br>Consul Honoraire de la République de Guinée';
            } else if (lang === 'en') {
                paper.className = 'ltr';
                paper.style.textAlign = 'left';
                // التوقيع يمين الصفحة، والنص موسط داخلياً
                sigWrapper.style.textAlign = 'right';
                sigContent.innerHTML = 'Dr. Hassan Jawad<br>Honorary Consul of the Republic of Guinea';
            }
        }

        window.onload = function() {
            setLanguage('ar');
        };

        function formatDoc(command, value) {
            document.querySelector('.document-body').focus();
            document.execCommand(command, false, value || null);
        }

        function clearPlaceholder() {
            var body = document.querySelector('.document-body');
            var placeholder = body.querySelector('.placeholder-text');
            if (placeholder) { body.innerHTML = '<p></p>'; }
        }

        var templates = {
            blank: { lang: 'ar', content: '<p></p>' },
            report_min_ar: {
                lang: 'ar',
                content: '<table style="width: 100%; border: none; margin-bottom: 20px;"><tr><td style="text-align: right; font-size: 13px;"><b>الرقم:</b> Ref.N199/MIN</td><td style="text-align: left; font-size: 13px;"><b>التاريخ:</b> 31 / 07 / 2026</td></tr></table><div style="text-align: center; margin-bottom: 30px; line-height: 1.6;"><span style="font-size: 18px; font-weight: bold;">معالي الدكتور موريساندا كوياتي</span><br><span style="font-size: 15px; font-weight: bold;">وزير الشؤون الخارجية والاندماج الأفريقي والغينيين في الخارج</span></div><p><b>الموضوع: التقرير الدوري لأعمال القنصلية الفخرية...</b></p><p>نص التقرير يكتب هنا...</p>'
            },
            report_min_fr: {
                lang: 'fr',
                content: '<table style="width: 100%; border: none; margin-bottom: 20px;"><tr><td style="text-align: left; font-size: 13px;"><b>Réf:</b> N199/MIN</td><td style="text-align: right; font-size: 13px;"><b>Date:</b> 31 / 07 / 2026</td></tr></table><div style="text-align: center; margin-bottom: 30px; line-height: 1.6;"><span style="font-size: 18px; font-weight: bold;">S.E. Dr. Morissanda Kouyaté</span><br><span style="font-size: 15px; font-weight: bold;">Ministre des Affaires Etrangères</span></div><p><b>Objet: Rapport Périodique...</b></p><p>Le contenu du rapport est écrit ici...</p>'
            }
        };

        function handleTemplateChange(val) {
            if (!val) return;
            var tmpl = templates[val];
            if (tmpl) {
                setLanguage(tmpl.lang);
                document.querySelector('.document-body').innerHTML = tmpl.content;
            }
        }

        function exportToWord() {
            var header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Export Document</title></head><body>";
            var footer = "</body></html>";
            var sourceHTML = header + document.getElementById("paper").innerHTML + footer;
            
            var source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
            var fileDownload = document.createElement("a");
            document.body.appendChild(fileDownload);
            fileDownload.href = source;
            fileDownload.download = 'Document_Consulaire.doc';
            fileDownload.click();
            document.body.removeChild(fileDownload);
        }
    </script>
</body>
</html>
