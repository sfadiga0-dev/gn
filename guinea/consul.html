<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سجل القنصلية الرسمي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card-glass">
            <div class="header-panel">
                <div>
                    <h2>السجل القنصلي الرسمي</h2>
                    <p class="fr-text" style="margin:0;">Registre Consulaire Officiel</p>
                </div>
                <div class="no-print">
                    <button class="btn btn-primary" onclick="window.print()">طباعة السجل كامل</button>
                    <button class="btn btn-dark" onclick="APP.logout()">خروج</button>
                </div>
            </div>
            <table>
                <thead>
                    <tr><th>ID</th><th>العائلة</th><th>الاسم</th><th>الأب والأم</th><th>الجواز</th></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
    <script src="app.js"></script>
    <script>
        APP.checkAuth('consul');
        const db = APP.getDB();
        const tbody = document.getElementById('tableBody');
        db.forEach(p => {
            tbody.innerHTML += `<tr>
                <td>${p.id}</td><td class="fr-text"><b>${p.family}</b></td>
                <td><a href="profile.html?id=${p.id}">${p.nomAr}</a></td>
                <td class="fr-text">${p.pere} & ${p.mere}</td>
                <td class="fr-text">${p.pass || 'N/A'}<br><b>${p.statut}</b></td>
            </tr>`;
        });
    </script>
</body>
</html>
