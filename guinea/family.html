<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ملف العائلة</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .family-card {
            border: 1px solid #ddd; padding: 15px; margin-bottom: 15px;
            border-radius: 8px; display: flex; justify-content: space-between;
            align-items: center; background: #fafafa;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>ملف مجموعة عائلة: <span id="familyNameDisplay"></span></h2>
            <button class="btn btn-dark no-print" onclick="APP.logout()">تسجيل الخروج</button>
        </div>

        <div id="membersList"></div>
    </div>

    <script src="app.js"></script>
    <script>
        const user = APP.checkAuth('family');
        document.getElementById('familyNameDisplay').innerText = user.name.toUpperCase();

        const db = APP.getDB();
        // تصفية البيانات لتطابق اسم العائلة المسجل دخوله (غير حساس لحالة الأحرف)
        const myFamily = db.filter(p => p.family.toLowerCase() === user.name.toLowerCase());
        
        const list = document.getElementById('membersList');
        
        if (myFamily.length === 0) {
            list.innerHTML = "<p>لا يوجد بيانات مسجلة لهذه العائلة.</p>";
        } else {
            myFamily.forEach(p => {
                let statusColor = p.statut.includes('À renouveler') ? 'red' : 'green';
                list.innerHTML += `
                    <div class="family-card">
                        <div>
                            <h3 style="margin:0 0 5px 0;">${p.nomAr} <span class="fr-text" style="font-size:14px; color:#555;">(${p.nomFr})</span></h3>
                            <p style="margin:5px 0; font-size:14px;">الجواز: <strong>${p.pass || 'لا يوجد'}</strong> | الحالة: <span style="color:${statusColor}; font-weight:bold;">${p.statut}</span></p>
                        </div>
                        <div class="no-print">
                            <a href="card.html?id=${p.id}" class="btn btn-primary" target="_blank">📄 عرض البطاقة القنصلية</a>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
