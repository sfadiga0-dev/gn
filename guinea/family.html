<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Espace Famille</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <img src="image_5321de.png" class="bg-watermark">
    <div class="navbar">
        <div id="welcome-msg"><strong>ESPACE FAMILLE</strong></div>
        <button class="btn btn-danger" onclick="logout()">خروج</button>
    </div>
    
    <div class="container" dir="rtl">
        <div class="card">
            <h3 style="color:var(--brand-dark); border-bottom: 2px solid var(--brand-gold); padding-bottom: 10px; margin-bottom: 20px;">أفراد العائلة المسجلين</h3>
            <table dir="ltr" style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="border-bottom: 2px solid #ccc; text-align: left;">
                        <th>Nom / Name</th>
                        <th>Passeport</th>
                        <th dir="rtl" style="text-align: right;">خيارات العرض</th>
                    </tr>
                </thead>
                <tbody id="family-table-body"></tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if(localStorage.getItem('role') !== 'family') window.location.href = 'index.html';
        
        const myFamily = localStorage.getItem('familyGroup');
        document.getElementById('welcome-msg').innerHTML = `<strong>ESPACE FAMILLE : ${myFamily.toUpperCase()}</strong>`;
        
        const tbody = document.getElementById('family-table-body');
        const familyMembers = citizensData.filter(c => c.family === myFamily);

        tbody.innerHTML = familyMembers.map(c => `
            <tr style="border-bottom: 1px solid #eee;">
                <td style="padding: 10px 0;"><strong>${c.firstName || ''} ${c.lastName || ''}</strong><br><small dir="rtl" style="color: #666;">${c.nameAr}</small></td>
                <td>${c.passport || '---'} <br><small>(${c.passStatus || ''})</small></td>
                <td dir="rtl" style="text-align: right;">
                    <button class="btn btn-primary" style="padding: 4px 10px; font-size: 12px;" onclick="window.location.href='profile.html?id=${c.id}'">عرض البروفايل</button>
                    <button class="btn btn-gold" style="padding: 4px 10px; font-size: 12px;" onclick="window.location.href='card.html?id=${c.id}'">عرض الهوية</button>
                </td>
            </tr>
        `).join('');
    </script>
</body>
</html>
