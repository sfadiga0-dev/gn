<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>إدارة العائلات</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="top-nav">
            <h2 data-i18n="title_family" style="margin:0; color:var(--gn-red);">إدارة العائلات</h2>
            <select class="lang-selector no-print" onchange="APP.setLang(this.value)">
                <option value="ar">العربية</option>
                <option value="fr">Français</option>
                <option value="en">English</option>
            </select>
        </div>

        <div id="familiesContainer"></div>
    </div>
    <script src="app.js"></script>
    <script>
        function renderFamilies() {
            const db = APP.getDB();
            // تجميع ذكي للعائلات
            const families = {};
            db.forEach(p => {
                if(!families[p.family]) families[p.family] = [];
                families[p.family].push(p);
            });

            const container = document.getElementById('familiesContainer');
            container.innerHTML = '';

            for (const [famName, members] of Object.entries(families)) {
                let rows = members.map(m => `<tr><td>${m.id}</td><td><a href="profile.html?id=${m.id}">${m.nom}</a></td><td>${m.dob}</td><td>${m.pere} & ${m.mere}</td></tr>`).join('');
                
                container.innerHTML += `
                    <div class="card" style="border-left: 4px solid var(--gn-yellow);">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
                            <h3 style="margin:0;">Famille: ${famName} <span style="font-size:12px; color:gray;">(${members.length} members)</span></h3>
                            <button class="btn btn-primary btn-sm no-print">+ إضافة فرد للعائلة</button>
                        </div>
                        <table>
                            <thead><tr><th>ID</th><th data-i18n="name">الاسم</th><th data-i18n="dob">تاريخ الولادة</th><th>Père & Mère</th></tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                `;
            }
        }
        window.onload = renderFamilies;
    </script>
</body>
</html>
