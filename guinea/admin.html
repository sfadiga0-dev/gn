<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Consular Admin</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

    <div class="container">
        <nav class="navbar glass-card">
            <div>
                <h2 data-i18n="greeting" style="margin:0; background: -webkit-linear-gradient(#FCD116, #CE1126); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">مرحباً، حسن جواد</h2>
                <p data-i18n="subtitle" style="margin:5px 0 0 0; color: var(--text-muted); font-size: 14px;">نظام الإدارة القنصلية الفاخر</p>
            </div>
            
            <div style="display: flex; gap: 10px;">
                <button class="btn" onclick="SYSTEM.toggleTheme()">🌓 <span data-i18n="light">فاتح</span></button>
                <select class="btn" style="background:transparent;" onchange="SYSTEM.applyLang(this.value)">
                    <option value="ar" style="color:#000;">العربية</option>
                    <option value="fr" style="color:#000;">Français</option>
                    <option value="en" style="color:#000;">English</option>
                </select>
            </div>
        </nav>

        <main class="glass-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 15px;">
                <input type="text" data-i18n="search" placeholder="ابحث عن مواطن، جواز سفر..." 
                       style="padding: 12px 20px; width: 300px; max-width: 100%; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 100px; color: var(--text-main); outline: none; backdrop-filter: blur(10px);">
                
                <button class="btn" style="border-color: var(--gn-yellow);">+ إضافة سجل جديد</button>
            </div>

            <div style="overflow-x: auto;">
                <table class="modern-table">
                    <thead>
                        <tr>
                            <th>N°</th>
                            <th>العائلة (Famille)</th>
                            <th>الاسم (Nom)</th>
                            <th>حالة الجواز (Statut)</th>
                            <th>الإجراءات (Actions)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><b>01</b></td>
                            <td style="color: var(--gn-yellow); font-weight: 600;">CAMARA</td>
                            <td>
                                <strong style="font-size: 1.1rem; display: block;">كرفالا كمارا</strong>
                                <span style="font-size: 0.8rem; color: var(--text-muted);">Kerfalla CAMARA</span>
                            </td>
                            <td><span style="background: rgba(0, 119, 73, 0.2); color: #10b981; padding: 5px 12px; border-radius: 100px; font-size: 0.85rem;">Valide / ساري</span></td>
                            <td>
                                <button class="btn" style="padding: 5px 15px; font-size: 0.8rem;">تعديل</button>
                            </td>
                        </tr>
                        <tr>
                            <td><b>02</b></td>
                            <td style="color: var(--gn-yellow); font-weight: 600;">KOUYATE</td>
                            <td>
                                <strong style="font-size: 1.1rem; display: block;">انفالي كوياتي</strong>
                                <span style="font-size: 0.8rem; color: var(--text-muted);">N'faly KOUYATE</span>
                            </td>
                            <td><span style="background: rgba(206, 17, 38, 0.2); color: #ef4444; padding: 5px 12px; border-radius: 100px; font-size: 0.85rem;">À renouveler</span></td>
                            <td>
                                <button class="btn" style="padding: 5px 15px; font-size: 0.8rem;">تعديل</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
