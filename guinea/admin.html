<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة القنصلية - تحكم كامل</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card-glass">
            <div class="header-panel">
                <div>
                    <h2>لوحة الإدارة الشاملة</h2>
                    <p style="margin:0; font-size: 14px;">صلاحيات الآدمن (إضافة، تعديل، حذف)</p>
                </div>
                <div class="no-print">
                    <button class="btn btn-primary" onclick="openModal()">+ إضافة سجل</button>
                    <button class="btn btn-dark" onclick="APP.logout()">خروج</button>
                </div>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>العائلة</th>
                        <th>الاسم (عربي/فرنسي)</th>
                        <th>الأب والأم</th>
                        <th>الجواز</th>
                        <th class="no-print">التحكم</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- نافذة الإضافة/التعديل -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3 style="border-bottom: 2px solid var(--gn-green); padding-bottom: 10px;">بيانات المواطن</h3>
            <input type="hidden" id="f_id">
            <div class="form-grid">
                <div class="form-group fr-text"><label>Famille</label><input type="text" id="f_family"></div>
                <div class="form-group"><label>الاسم الكامل (عربي)</label><input type="text" id="f_nomAr"></div>
                <div class="form-group fr-text"><label>Nom Complet (FR)</label><input type="text" id="f_nomFr"></div>
                <div class="form-group fr-text"><label>Nom du Père</label><input type="text" id="f_pere"></div>
                <div class="form-group fr-text"><label>Nom de la Mère</label><input type="text" id="f_mere"></div>
                <div class="form-group fr-text"><label>Date de Naissance</label><input type="text" id="f_dob"></div>
                <div class="form-group fr-text"><label>Lieu de Naissance</label><input type="text" id="f_pob"></div>
                <div class="form-group fr-text"><label>Passeport</label><input type="text" id="f_pass"></div>
                <div class="form-group fr-text"><label>Statut</label><input type="text" id="f_statut"></div>
                <div class="form-group"><label>العنوان</label><input type="text" id="f_address"></div>
            </div>
            <div style="margin-top: 20px; text-align: left;">
                <button class="btn btn-primary" onclick="saveData()">حفظ البيانات</button>
                <button class="btn btn-dark" onclick="closeModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        APP.checkAuth('admin');
        
        function renderTable() {
            const db = APP.getDB();
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            db.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td>${p.id}</td>
                        <td class="fr-text"><b>${p.family}</b></td>
                        <td>
                            <a href="profile.html?id=${p.id}" style="text-decoration:none; color:var(--dark-bg); font-weight:bold;">${p.nomAr}</a>
                            <br><span class="fr-text" style="font-size:12px; color:#666;">${p.nomFr}</span>
                        </td>
                        <td class="fr-text">${p.pere} & ${p.mere}</td>
                        <td class="fr-text">${p.pass || 'N/A'}<br><span style="color:${p.statut.includes('Valide') ? 'green' : 'red'}">${p.statut}</span></td>
                        <td class="no-print">
                            <button class="btn btn-warning" style="padding: 5px 10px;" onclick="editData(${p.id})">تعديل</button>
                            <button class="btn btn-danger" style="padding: 5px 10px;" onclick="deleteData(${p.id})">حذف</button>
                        </td>
                    </tr>`;
            });
        }

        function openModal() { document.getElementById('editModal').style.display = 'block'; document.querySelectorAll('input').forEach(i => i.value = ''); }
        function closeModal() { document.getElementById('editModal').style.display = 'none'; }
        
        function editData(id) {
            const p = APP.getDB().find(x => x.id === id);
            document.getElementById('f_id').value = p.id;
            ['family', 'nomFr', 'nomAr', 'pere', 'mere', 'dob', 'pob', 'pass', 'statut', 'address'].forEach(k => document.getElementById('f_'+k).value = p[k]);
            document.getElementById('editModal').style.display = 'block';
        }

        function saveData() {
            let db = APP.getDB();
            let id = document.getElementById('f_id').value;
            let newData = { id: id ? parseInt(id) : Date.now() }; // إنشاء ID جديد في حال الإضافة
            ['family', 'nomFr', 'nomAr', 'pere', 'mere', 'dob', 'pob', 'pass', 'statut', 'address'].forEach(k => newData[k] = document.getElementById('f_'+k).value);
            
            if(id) { db[db.findIndex(x => x.id == id)] = newData; } else { db.push(newData); }
            APP.saveDB(db); closeModal(); renderTable();
        }

        function deleteData(id) {
            if(confirm('هل أنت متأكد من الحذف؟')) { APP.saveDB(APP.getDB().filter(x => x.id !== id)); renderTable(); }
        }
        renderTable();
    </script>
</body>
</html>
