<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة مواطن - الجالية الغينية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand">
            <img src="Coat_of_Arms_of_Guinea.svg" alt="شعار غينيا">
            <h1 class="navbar-title">إضافة مواطن جديد</h1>
        </div>
        <div>
            <a href="index.html" class="btn btn-primary">العودة للرئيسية</a>
        </div>
    </nav>

    <div class="table-container" style="max-width: 800px;">
        <form id="add-citizen-form">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label>الاسم بالعربية</label>
                    <input type="text" id="input-name-ar" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>الاسم بالفرنسية (كما في الجواز)</label>
                    <input type="text" id="input-name-fr" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>العائلة</label>
                    <input type="text" id="input-family" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>اسم الأب</label>
                    <input type="text" id="input-pere" class="form-control">
                </div>
                <div class="form-group">
                    <label>اسم الأم</label>
                    <input type="text" id="input-mere" class="form-control">
                </div>
                <div class="form-group">
                    <label>تاريخ ومكان الولادة</label>
                    <input type="text" id="input-dob" class="form-control" placeholder="مثال: 1999 - Damas">
                </div>
                <div class="form-group">
                    <label>رقم جواز السفر</label>
                    <input type="text" id="input-passport" class="form-control" value="لا يوجد">
                </div>
                <div class="form-group">
                    <label>حالة الجواز / الإقامة</label>
                    <input type="text" id="input-status" class="form-control">
                </div>
                <div class="form-group">
                    <label>العنوان في سوريا</label>
                    <input type="text" id="input-address" class="form-control">
                </div>
                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <input type="text" id="input-phone" class="form-control">
                </div>
                <div class="form-group">
                    <label>الحالة الاجتماعية</label>
                    <input type="text" id="input-marital" class="form-control">
                </div>
            </div>
            <button type="submit" class="btn btn-warning" style="width: 100%; margin-top: 20px; font-size: 18px;">حفظ وإضافة للنظام</button>
        </form>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
