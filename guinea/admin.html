<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>لوحة الإدارة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="top-nav">
            <h2 data-i18n="title_admin" style="margin:0; color:var(--gn-green);">لوحة الإدارة - الصلاحيات الكاملة</h2>
            <select class="lang-selector no-print" onchange="APP.setLang(this.value)">
                <option value="ar">العربية</option>
                <option value="fr">Français</option>
                <option value="en">English</option>
            </select>
        </div>

        <div class="card">
            <div class="no-print" style="margin-bottom: 15px;">
                <button class="btn btn-primary" onclick="alert('سيتم فتح نافذة الإضافة')"><span data-i18n="add">إضافة</span> +</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th data-i18n="family">العائلة</th>
                        <th data-i18n="name">الاسم</th>
                        <th data-i18n="dob">تاريخ الولادة</th>
                        <th>Statut</th>
                        <th data-i18n="actions" class="no-print">إجراءات</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody"></tbody>
            </table>
        </div>
    </div>
    <script src="app.js"></script>
    <script>
        function renderTable() {
            const db = APP.getDB();
            const tbody = document.getElementById('adminTableBody');
            tbody.innerHTML = '';
            db.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td>${p.id}</td>
                        <td><strong>${p.family}</strong></td>
                        <td><a href="profile.html?id=${p.id}" style="color:var(--dark); text-decoration:none;">${p.nom}</a></td>
                        <td>${p.dob}</td>
                        <td>${p.statut}</td>
                        <td class="no-print">
                            <button class="btn btn-warning btn-sm" data-i18n="edit">تعديل</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteRecord(${p.id})" data-i18n="delete">حذف</button>
                        </td>
                    </tr>
                `;
            });
            APP.setLang(localStorage.getItem('lang') || 'ar'); // تحديث النصوص
        }
        function deleteRecord(id) {
            if(confirm('تأكيد الحذف؟')) {
                APP.saveDB(APP.getDB().filter(x => x.id !== id));
                renderTable();
            }
        }
        window.onload = renderTable;
    </script>
</body>
</html>
