<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>البطاقة القنصلية</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .id-card {
            width: 85.6mm; height: 53.98mm; /* حجم البطاقة العالمية القياسي */
            border: 2px solid var(--gn-green); border-radius: 8px;
            background: white url('image_5321de.png') no-repeat center center;
            background-size: 50%; padding: 10px; margin: 20px auto;
            position: relative; box-sizing: border-box; overflow: hidden;
        }
        /* تبييض الخلفية وجعل اللوغو مائي */
        .id-card::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.85); z-index: 1; }
        .id-card-content { position: relative; z-index: 2; font-size: 11px; line-height: 1.4; }
        .card-header { text-align: center; border-bottom: 2px solid var(--gn-red); margin-bottom: 5px; padding-bottom: 3px; }
        .card-header h4 { margin: 0; color: var(--gn-green); font-size: 12px; }
        .row-data { display: flex; justify-content: space-between; border-bottom: 1px dotted #ccc; margin-bottom: 3px; }
        .row-label { font-weight: bold; color: var(--text-main); }
        .row-val { font-weight: bold; }
    </style>
</head>
<body style="background: white;">
    <div class="no-print" style="text-align: center; margin: 20px;">
        <button class="btn btn-primary" onclick="window.print()">طباعة البطاقة</button>
        <button class="btn btn-dark" onclick="window.history.back()">رجوع</button>
    </div>

    <div class="id-card" id="cardData"></div>

    <script src="app.js"></script>
    <script>
        const personId = parseInt(new URLSearchParams(window.location.search).get('id'));
        const p = APP.getDB().find(x => x.id === personId);
        
        if(p) {
            document.getElementById('cardData').innerHTML = `
                <div class="id-card-content">
                    <div class="card-header">
                        <h4>الجمهورية الغينية - الجالية في سوريا</h4>
                        <span class="fr-text" style="font-size:10px;">Carte Consulaire - Syrie</span>
                    </div>
                    <div class="row-data"><span class="row-label">الاسم:</span> <span class="row-val">${p.nomAr}</span></div>
                    <div class="row-data"><span class="row-label">Nom:</span> <span class="row-val fr-text">${p.nomFr}</span></div>
                    <div class="row-data"><span class="row-label">العائلة/Famille:</span> <span class="row-val fr-text">${p.family}</span></div>
                    <div class="row-data"><span class="row-label">تاريخ الولادة/Né le:</span> <span class="row-val fr-text">${p.dob}</span></div>
                    <div class="row-data"><span class="row-label">رقم الجواز:</span> <span class="row-val fr-text">${p.pass || 'N/A'}</span></div>
                    <div style="text-align:center; margin-top:5px; color:var(--gn-red); font-size:9px; font-weight:bold;">هذه البطاقة صادرة عن القنصلية وغير قابلة للتحويل</div>
                </div>
            `;
        }
    </script>
</body>
</html>
