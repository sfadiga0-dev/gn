<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Impression de Carte d'Identité Consulaire</title>
    <style>
        :root { --g-red: #ce1126; --g-yellow: #fcd116; --g-green: #009460; --dark: #0f172a; }
        body { background-color: #475569; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 20px; font-family: system-ui; }
        .panel { background: white; padding: 12px; border-radius: 6px; text-align: center; width: 86mm; }
        .btn { padding: 8px 16px; font-weight: bold; border-radius: 4px; border: none; background: var(--dark); color: white; cursor: pointer; }
        .id-card { width: 86mm; height: 54mm; background: white; border-radius: 4mm; border: 1px solid #94a3b8; position: relative; overflow: hidden; box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .card-watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60%; opacity: 0.05; pointer-events: none; }
        .flag-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 3mm; display: flex; }
        .b-r { flex: 1; background: var(--g-red); }
        .b-y { flex: 1; background: var(--g-yellow); }
        .b-g { flex: 1; background: var(--g-green); }
        .layout { padding: 3mm; display: flex; flex-direction: column; height: 100%; box-sizing: border-box; }
        .hdr { display: flex; justify-content: space-between; border-bottom: 1px solid var(--g-yellow); padding-bottom: 1mm; }
        .body-zone { display: flex; gap: 3mm; margin-top: 2mm; height: calc(100% - 10mm); }
        .photo { width: 20mm; height: 26mm; border: 1px solid var(--dark); background: #f1f5f9; }
        .fields { flex-grow: 1; display: flex; flex-direction: column; gap: 1mm; font-size: 7.5pt; }
        .row-item { display: flex; justify-content: space-between; border-bottom: 0.5px dashed #e2e8f0; }
        @media print { .no-print { display: none !important; } body { background: white; padding: 0; } .id-card { border: 1px solid #000; page-break-inside: avoid; } }
    </style>
</head>
<body>

    <div class="panel no-print">
        <button class="btn" onclick="window.print()">🖨️ طباعة الهوية القنصلية</button>
        <button class="btn" style="background:#64748b;" onclick="window.history.back()">↩️ عودة</button>
    </div>

    <div id="card-render-zone"></div>

    <script src="app.js"></script>
    <script>
        const id = new URLSearchParams(window.location.search).get('id');
        const db = JSON.parse(localStorage.getItem('citizens_db_v5')) || [];
        const person = db.find(c => c.id == id) || db[0];

        if (person) {
            document.getElementById('card-render-zone').innerHTML = `
                <div class="id-card">
                    <img src="image_5321de.png" class="card-watermark">
                    <div class="layout">
                        <div class="hdr">
                            <span style="font-size:6.5pt; font-weight:bold; color:var(--dark);">RÉPUBLIQUE DE GUINÉE<br>CONSULAT DE DAMAS</span>
                            <span dir="rtl" style="font-size:6.5pt; font-weight:bold; color:var(--g-green); text-align:right;">جمهورية غينيا<br>القنصلية في دمشق</span>
                        </div>
                        <div class="body-zone">
                            <div class="photo"><svg viewBox="0 0 24 24" fill="%23cbd5e1" style="margin-top:4px;"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>
                            <div class="fields">
                                <div class="row-item"><span>Nom: <b>${person.lastName}</b></span><span dir="rtl">الكنية: <b>${person.lastName}</b></span></div>
                                <div class="row-item"><span>Prénom: <b>${person.firstName}</b></span><span dir="rtl">الاسم: <b>${person.firstName}</b></span></div>
                                <div class="row-item" style="background:#f8fafc; padding:1px 0;"><span dir="rtl" style="width:100%; text-align:center; font-size:8.5pt; font-weight:bold; color:var(--g-green);">${person.nameAr}</span></div>
                                <div class="row-item"><span>Né le: <b>${person.dob}</b></span><span dir="rtl">التولد: <b>${person.dob}</b></span></div>
                                <div class="row-item"><span>N° Pass: <b style="color:var(--g-red); font-family:monospace;">${person.passport}</b></span><span dir="rtl">الجواز: <b>${person.passport}</b></span></div>
                            </div>
                        </div>
                    </div>
                    <div class="flag-bar"><div class="b-r"></div><div class="b-y"></div><div class="b-g"></div></div>
                </div>
            `;
        }
    </script>
</body>
</html>
