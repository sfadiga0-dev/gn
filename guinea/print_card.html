<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>تجرية واجهات الطباعة القنصلية - دمشق</title>
    <style>
        /* إعدادات صفحة الطباعة القياسية CR80 */
        @page {
            size: 86mm 54mm;
            margin: 0;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 🛠️ لوحة تحكم الاختيار (تختفي عند الطباعة) */
        .demo-controls {
            background: #0f172a;
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            text-align: center;
            width: 100%;
            max-width: 800px;
            z-index: 100;
        }
        .control-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .btn-mode {
            background-color: #334155;
            color: white;
            border: 2px solid transparent;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .btn-mode:hover { background-color: #475569; }
        .btn-mode.active {
            border-color: #eab308;
            background-color: #1e293b;
        }
        .print-actions { margin-top: 15px; border-top: 1px solid #334155; padding-top: 10px;}
        .btn-print { background-color: #CE1126; color: white; padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin: 0 5px;}

        /* حاوية البطاقات (تعرض الوجهين بجانب بعض بالشاشة) */
        .cards-wrapper {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
            position: relative;
        }

        /* التصميم الأساسي للبطاقة */
        .card-container {
            width: 86mm;
            height: 54mm;
            position: relative;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden;
            box-sizing: border-box;
            background-color: white;
        }

        /* العناصر القابلة للسحب والتعديل */
        .draggable {
            position: absolute;
            cursor: move;
            font-size: 9pt;
            font-weight: bold;
            color: #000;
            white-space: nowrap;
            padding: 2px 4px;
            border: 1px dashed transparent;
            z-index: 10;
        }
        .draggable:hover { border-color: #3b82f6; background-color: rgba(255,255,255,0.8); }
        .draggable[contenteditable="true"]:focus { outline: none; border-color: #10b981; background-color: white; cursor: text;}

        .photo-box {
            position: absolute;
            top: 12mm; left: 4mm;
            width: 22mm; height: 28mm;
            border: 1.5px solid #111;
            background: rgba(255,255,255,0.8);
            cursor: move;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; color: #444; font-weight: bold;
            z-index: 5;
        }

        /* ============================================================
           🔬 تطبيق الـ 3 خطوات (MODES) عبر الـ CSS
        ============================================================ */

        /* 1️⃣ الخطوة الأولى: الفلاتر البرمجية البسيطة (CSS Filters) */
        /* تزيد التباين والسطوع وتحسن الألوان تلقائياً */
        body.mode-filters .card-container {
            filter: contrast(120%) brightness(110%) saturate(130%);
        }

        /* 2️⃣ الخطوة الثانية: المعالجة المتقدمة (AI Enhanced) */
        /* نفترض هنا أننا قمنا بتحسين الصور خارجياً ورفعناها بأسماء جديدة */
        /* للتدليل، سنقوم بعمل معالجة قوية جداً بالـ CSS لتبدو كالصور المعالجة */
        body.mode-enhanced .card-container {
            filter: contrast(150%) brightness(120%) saturate(180%) sharp(1px);
            box-shadow: 0 10px 25px rgba(0,148,96,0.3); /* توهج أخضر للتمييز */
        }

        /* 3️⃣ الخطوة الثالثة: هيكلية المسح الضوئي (Scanner) */
        /* هذه هي النتيجة المثالية: خلفية بيضاء تماماً، والكرتون مطبوع مسبقاً */
        body.mode-scanner .card-container {
            background-image: none !important; /* نلغي صورة الخلفية كلياً بالشاشة */
            background-color: #ffffff;
            border: 2px solid var(--guinea-green); /* إطار أخضر للتدليل على حدود الكرتون */
        }
        /* في وضع المسح الضوئي، نغير لون الحقول مؤقتاً للشاشة لنرى أماكنها */
        body.mode-scanner .draggable { color: #000; border-color: #ccc; }
        body.mode-scanner .photo-box { background: #f8fafc; border-color: #000; }


        /* الخلفيات الأصلية */
        #front-card { background-image: url('image_9ed7e8.jpg'); }
        #back-card { background-image: url('image_9ed80b.jpg'); }

        /* ============================================================
           🖨️ إعدادات الطباعة النهائية (ميكانيكية فوق الكرتون)
        ============================================================ */
        @media print {
            .demo-controls { display: none !important; }
            .cards-wrapper { display: block; gap: 0; }
            .card-container {
                box-shadow: none !important;
                background-image: none !important; /* حتمياً: لا نطبع صورة الكرتون أبداً */
                margin: 0 !important;
                border: none !important;
                position: absolute; top: 0; left: 0;
                filter: none !important; /* نلغي كافة الفلاتر عند الطباعة */
            }
            .draggable { border: none !important; background: transparent !important; padding: 0 !important; }
            .photo-box { border: none !important; background: transparent !important; color: transparent !important;}

            /* نظام الطباعة المنفصل للوجهين */
            body.print-front #back-card { display: none !important; }
            body.print-back #front-card { display: none !important; }
        }
    </style>
</head>
<body class="mode-filters"> <div class="demo-controls no-print">
        <h2 style="margin: 0 0 5px 0; color: #eab308;">اختبر وقارن بين الطرق الثلاث للوضوح</h2>
        <p style="margin: 0 0 15px 0; font-size: 13px; color: #94a3b8;">اختر الطريقة التي تريح عينك في المعاينة والمطابقة، ثم اطبع فوق كرتون القنصلية الملون.</p>
        
        <div class="control-group">
            <button class="btn-mode active" onclick="setMode('filters', this)" title="تحسين تلقائي لألوان وسطوع الصور الحالية">1️⃣ الخطوة الأولى: فلاتر برمجية</button>
            <button class="btn-mode" onclick="setMode('enhanced', this)" title="معالجة قوية جداً للتباين تشبه معالجة الذكاء الاصطناعي">2️⃣ الخطوة الثانية: معالجة متقدمة</button>
            <button class="btn-mode" onclick="setMode('scanner', this)" title="النتيجة المثالية: مسح ضوئي حقيقي (Scanner)">3️⃣ الخطوة الثالثة: النتيجة المثالية</button>
        </div>

        <div class="print-actions">
            <button class="btn-print" onclick="printSide('front')" style="background-color: #009460;">🖨️ طباعة الوجه الأمامي فوق الكرتون</button>
            <button class="btn-print" onclick="printSide('back')" style="background-color: #CE1126;">🖨️ طباعة الوجه الخلفي فوق الكرتون</button>
        </div>
    </div>

    <div class="cards-wrapper">
        
        <div class="card-container" id="front-card">
            <div class="photo-box draggable" style="top: 15mm; left: 5mm;" title="اسحبني">صورة</div>

            <div class="draggable" contenteditable="true" style="top: 15mm; left: 30mm;">Alpha Oumar BALDE</div>
            <div class="draggable" contenteditable="true" style="top: 22mm; left: 30mm;">G0023941</div>
            <div class="draggable" contenteditable="true" style="top: 29mm; left: 30mm;">12/05/1988</div>

            <div class="draggable" contenteditable="true" style="top: 15mm; right: 4mm; direction: rtl;">ألفا عمر بالدي</div>
            <div class="draggable" contenteditable="true" style="top: 22mm; right: 4mm; direction: rtl;">Balde</div>
            <div class="draggable" contenteditable="true" style="top: 29mm; right: 4mm; direction: rtl;">دمشق، المزة</div>
        </div>

        <div class="card-container" id="back-card">
            <div class="draggable" contenteditable="true" style="top: 15mm; left: 10mm;">Délivré le: 20/05/2026</div>
            <div class="draggable" contenteditable="true" style="top: 22mm; left: 10mm;">Expire le: 20/05/2031</div>
            <div class="draggable" contenteditable="true" style="top: 30mm; left: 10mm; color: #CE1126; font-style: italic;">Signature et Sceau</div>
        </div>

    </div>

    <script>
        // سكربت تبديل الأوضاع (Modes)
        function setMode(mode, btnEl) {
            // إزالة الكلاس النشط من كافة الأوضاع في الـ body والأزرار
            document.body.classList.remove('mode-filters', 'mode-enhanced', 'mode-scanner');
            document.querySelectorAll('.btn-mode').forEach(btn => btn.classList.remove('active'));
            
            // إضافة الكلاس الجديد النشط
            document.body.classList.add('mode-' + mode);
            btnEl.classList.add('active');
        }

        // نظام الطباعة المنفصل للوجهين
        function printSide(side) {
            document.body.classList.remove('print-front', 'print-back');
            document.body.classList.add('print-' + side);
            window.print();
        }

        // سكربت السحب والإفلات لتعديل أماكن الكلمات بالماوس
        let activeEl = null;
        let startX, startY, initialLeft, initialTop;

        document.querySelectorAll('.draggable').forEach(el => {
            el.addEventListener('mousedown', function(e) {
                // منع السحب إذا كنا نضغط لنكتب نصاً
                if (document.activeElement === el && el.getAttribute('contenteditable') === 'true') return;
                
                activeEl = el;
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = el.offsetLeft;
                initialTop = el.offsetTop;
            });
        });

        document.addEventListener('mousemove', function(e) {
            if(activeEl) {
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                activeEl.style.left = (initialLeft + dx) + 'px';
                activeEl.style.top = (initialTop + dy) + 'px';
                // إزالة خاصية right إذا سحبنا عنصراً عربياً ليتحرك بحرية
                if(activeEl.style.right) activeEl.style.right = 'auto';
            }
        });

        document.addEventListener('mouseup', function() { activeEl = null; });
    </script>
</body>
</html>
