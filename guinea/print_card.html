<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>طباعة البطاقة القنصلية - الوجهين</title>
    <style>
        /* إعدادات صفحة الطباعة بمقاس الهوية */
        @page {
            size: 86mm 54mm;
            margin: 0;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* أدوات التحكم العلوية */
        .no-print-toolbar {
            background: #0f172a;
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            text-align: center;
            width: 100%;
            max-width: 600px;
            z-index: 100;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }
        .btn {
            background-color: #334155;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }
        .btn:hover { background-color: #475569; }
        .btn-front { background-color: #009460; }
        .btn-front:hover { background-color: #007a4f; }
        .btn-back { background-color: #CE1126; }
        .btn-back:hover { background-color: #a80e1f; }

        /* حاوية البطاقات (تعرض الوجهين بجانب بعض بالشاشة) */
        .cards-wrapper {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* التصميم المشترك للبطاقتين */
        .card-container {
            width: 86mm;
            height: 54mm;
            position: relative;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden;
            box-sizing: border-box;
            background-color: white;
        }

        /* خلفية الوجه الأمامي */
        #front-card {
            background-image: url('image_9ed7e8.jpg'); /* اسم صورة الوجه الأمامي */
        }

        /* خلفية الوجه الخلفي */
        #back-card {
            background-image: url('image_9ed80b.jpg'); /* اسم صورة الوجه الخلفي */
        }

        /* العناصر القابلة للسحب والتعديل */
        .draggable {
            position: absolute;
            cursor: move;
            font-size: 9pt;
            font-weight: bold;
            color: #000;
            white-space: nowrap;
            padding: 2px 4px;
            border: 1px dashed transparent;
            border-radius: 3px;
        }
        .draggable:hover {
            border-color: #3b82f6;
            background-color: rgba(255,255,255,0.9);
            z-index: 50;
        }
        .draggable[contenteditable="true"]:focus {
            outline: none;
            border-color: #10b981;
            background-color: white;
            cursor: text;
            z-index: 50;
        }

        /* إطار الصورة الشخصية في الوجه الأمامي */
        .photo-box {
            position: absolute;
            top: 12mm;
            left: 4mm;
            width: 22mm;
            height: 28mm;
            border: 1.5px solid #111;
            background: rgba(255,255,255,0.8);
            cursor: move;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #444;
            font-weight: bold;
        }

        /* إعدادات الطباعة: إخفاء كل شيء باستثناء الوجه المطلوب طباعته! */
        @media print {
            body { 
                background-color: white; 
                padding: 0; 
                margin: 0; 
                display: block; 
            }
            .no-print-toolbar { display: none !important; }
            .cards-wrapper { display: block; gap: 0; }
            
            .card-container {
                box-shadow: none !important;
                background-image: none !important; /* إلغاء طباعة صورة الكرتون */
                margin: 0 !important;
                border: none !important;
                position: absolute;
                top: 0;
                left: 0;
            }
            
            .draggable { border: none !important; background: transparent !important; padding: 0 !important; }
            .photo-box { border: none !important; background: transparent !important; color: transparent !important;}

            /* الكود السحري: التحكم بمن يطبع بناءً على الكلاس */
            body.print-front #back-card { display: none !important; }
            body.print-back #front-card { display: none !important; }
        }
    </style>
</head>
<body>

    <div class="no-print-toolbar">
        <h2 style="margin: 0 0 5px 0;">نظام طباعة الهوية القنصلية - الوجهين</h2>
        <p style="margin: 0 0 15px 0; font-size: 13px; color: #94a3b8;">اضبط النصوص بالماوس، ثم اطبع الوجه الأول، اقلب الكرتونة واطبع الوجه الثاني.</p>
        
        <div class="btn-group">
            <button class="btn" onclick="window.history.back()">⬅️ رجوع للوحة</button>
            <button class="btn btn-front" onclick="printSide('front')">🖨️ طباعة الوجه الأمامي</button>
            <button class="btn btn-back" onclick="printSide('back')">🖨️ طباعة الوجه الخلفي</button>
        </div>
    </div>

    <div class="cards-wrapper">
        
        <div class="card-container" id="front-card">
            <div class="photo-box" style="top: 12mm; left: 4mm;" title="اسحبني">صورة (Photo)</div>

            <div class="draggable" contenteditable="true" style="top: 14mm; left: 30mm;" id="fr-name"></div>
            <div class="draggable" contenteditable="true" style="top: 21mm; left: 30mm;" id="fr-passport"></div>
            <div class="draggable" contenteditable="true" style="top: 28mm; left: 30mm;" id="fr-birth"></div>

            <div class="draggable" contenteditable="true" style="top: 14mm; right: 4mm; direction: rtl;" id="ar-name"></div>
            <div class="draggable" contenteditable="true" style="top: 21mm; right: 4mm; direction: rtl;" id="ar-family"></div>
            <div class="draggable" contenteditable="true" style="top: 28mm; right: 4mm; direction: rtl;" id="ar-address"></div>
        </div>

        <div class="card-container" id="back-card">
            <div class="draggable" contenteditable="true" style="top: 15mm; left: 10mm;">Date de Délivrance: <span id="issue-date"></span></div>
            <div class="draggable" contenteditable="true" style="top: 22mm; left: 10mm;">Date d'Expiration: <span id="expiry-date"></span></div>
            <div class="draggable" contenteditable="true" style="top: 30mm; left: 10mm; color: #CE1126;">Signature du Consul</div>
        </div>

    </div>

    <script>
        // 1. جلب بيانات المواطن المختار
        const db = JSON.parse(localStorage.getItem('guinea_citizens_db')) || [];
        const urlParams = new URLSearchParams(window.location.search);
        const citizenId = parseInt(urlParams.get('id'));
        const citizen = db.find(c => c.id === citizenId) || {
            nameFr: "Nom Prenom", nameAr: "الاسم الكامل", family: "العائلة", passport: "G000000", birth: "01/01/2000 - Damas", address: "Damas"
        };

        // 2. تعبئة البيانات في الوجه الأمامي
        document.getElementById('fr-name').innerText = citizen.nameFr;
        document.getElementById('fr-passport').innerText = citizen.passport;
        document.getElementById('fr-birth').innerText = citizen.birth.split(' - ')[0]; // تاريخ فقط
        
        document.getElementById('ar-name').innerText = citizen.nameAr;
        document.getElementById('ar-family').innerText = citizen.family;
        document.getElementById('ar-address').innerText = citizen.address;

        // 3. تعبئة تواريخ افتراضية في الوجه الخلفي (تاريخ اليوم وتاريخ بعد 5 سنوات)
        const today = new Date();
        const expiry = new Date(); expiry.setFullYear(today.getFullYear() + 5);
        document.getElementById('issue-date').innerText = today.toLocaleDateString('fr-FR');
        document.getElementById('expiry-date').innerText = expiry.toLocaleDateString('fr-FR');

        // 4. نظام الطباعة المنفصل (سحر الـ CSS)
        function printSide(side) {
            // إزالة أي كلاسات سابقة
            document.body.classList.remove('print-front', 'print-back');
            // إضافة كلاس الوجه المطلوب ليقوم الـ CSS بإخفاء الوجه الآخر
            document.body.classList.add('print-' + side);
            // استدعاء نافذة الطباعة
            window.print();
        }

        // 5. سكربت السحب والإفلات لتعديل أماكن الكلمات بالماوس
        let activeEl = null;
        let startX, startY, initialLeft, initialTop;

        document.querySelectorAll('.draggable, .photo-box').forEach(el => {
            el.addEventListener('mousedown', function(e) {
                // منع السحب إذا كنا نضغط لنكتب نصاً
                if (document.activeElement === el) return;
                
                activeEl = el;
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = el.offsetLeft;
                initialTop = el.offsetTop;
            });
        });

        document.addEventListener('mousemove', function(e) {
            if(activeEl) {
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                activeEl.style.left = (initialLeft + dx) + 'px';
                activeEl.style.top = (initialTop + dy) + 'px';
                // إزالة خاصية right إذا سحبنا عنصراً عربياً ليتحرك بحرية
                if(activeEl.style.right) activeEl.style.right = 'auto';
            }
        });

        document.addEventListener('mouseup', function() {
            activeEl = null;
        });
    </script>
</body>
</html>
